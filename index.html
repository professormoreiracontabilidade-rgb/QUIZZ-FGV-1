.top {

  font-size: 16px;

.bar {

.bar span {

}

article {

button {

  padding: 13px 17px;

  color: #163e60;

button:focus-visible {

  outline-offset: 3px;
}

button:disabled {

  opacity: .55;
}

.option {

  display: flex;
  gap: 13px;
  width: 100%;
  line-height: 1.45;
}

.option.selected {

  border: 2px solid #247abd;
}

.option.good {
  background: #e2f8e9;
  border: 2px solid #208345;
}

.option.bad {
  background: #ffe8e8;
  border: 2px solid #c33;
}

.primary {
  background: #155d95;
  color: white;
  border: 0;
  width: 100%;
  margin-top: 20px;
}

.feedback {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 20px 0;
  font-weight: bold;
}

.lamp {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #b9c5cd;
  flex-shrink: 0;
}

.lamp.green {
  background: #16ba54;
  box-shadow: 0 0 14px 5px #16ba5455;
}

.lamp.red {
  background: #ef3434;
  box-shadow: 0 0 14px 5px #ef343455;

.comment {

}

.answer {

nav {

footer {

  padding: 20px;
}

@media (max-width: 480px) {

@media (prefers-reduced-motion: reduce) {

let page = 0;
let selected = Array(11).fill(null);
let answers = Array(11).fill(null);
let soundOn = true;
let audioContext;

const $ = id => document.getElementById(id);

const esc = s => String(s).replace(/[&<>"']/g, c => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[c]));

function tone(ok) {
  if (!soundOn) return;

  try {
    audioContext ||= new (
      window.AudioContext || window.webkitAudioContext
    )();

    audioContext.resume();

    const start = audioContext.currentTime;
    const notes = ok
      ? [523.25, 659.25, 783.99]
      : [220, 164.81];

    notes.forEach((freq, i) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = ok ? "sine" : "triangle";
      oscillator.frequency.value = freq;
      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      const time = start + i * .16;

      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(.16, time + .02);
      gain.gain.exponentialRampToValueAtTime(.001, time + .24);

      oscillator.start(time);
      oscillator.stop(time + .25);
    });
  } catch (error) {
    // O quiz continua funcionando se o áudio não estiver disponível.
  }
}

function render() {
  const correct = answers.filter(
    (answer, i) => answer === questions[i].key
  ).length;

  const done = answers.filter(Boolean).length;

  $("score").textContent =
    `${correct} acertos • ${done}/11 respondidas`;

  $("progress").style.width = (done / 11 * 100) + "%";
  $("back").disabled = page === 0;

  if (page === 22) {
    $("position").textContent = "Quiz concluído";

    $("screen").innerHTML = `
      <h1>Resultado final</h1>
      <p>
        Você acertou <strong>${correct} de 11</strong> questões
        (${Math.round(correct / 11 * 100)}%).
      </p>
      <p>
        Revise os comentários usando o botão Voltar ou reinicie
        para praticar novamente.
      </p>
    `;

    $("next").disabled = true;
    return;
  }

  const i = Math.floor(page / 2);
  const q = questions[i];
  const comment = page % 2 === 1;
  const answered = answers[i] !== null;
  const ok = answers[i] === q.key;

  $("position").textContent =
    `Questão ${i + 1}/11 • ${comment ? "Comentário" : "Responder"}`;

  $("next").disabled = !answered;

  $("next").textContent = comment
    ? (i === 10 ? "Ver resultado →" : "Próxima questão →")
    : "Ver comentário →";

  const feedback = answered ? `
    <div class="feedback" role="status">
      <span
        class="lamp ${ok ? "green" : "red"}"
        aria-hidden="true"
      ></span>
      <span>${ok ? "✓ Você acertou!" : "✕ Você errou."}</span>
    </div>
  ` : "";

  const content = comment ? `
    ${feedback}
    <div class="answer">
      <strong>Gabarito: ${q.key}</strong><br>
      ${esc(q.options.find(option => option.letter === q.key).text)}
    </div>
    <h2>Comentário</h2>
    <div class="comment">${esc(q.comment)}</div>
  ` : `
    <div class="stem">${esc(q.stem)}</div>

    <div class="options">
      ${q.options.map(option => `
        <button
          class="option
            ${selected[i] === option.letter ? "selected" : ""}
            ${answered && option.letter === q.key ? "good" : ""}
            ${
              answered &&
              answers[i] === option.letter &&
              !ok ? "bad" : ""
            }"
          data-letter="${option.letter}"
          aria-pressed="${selected[i] === option.letter}"
          ${answered ? "disabled" : ""}
        >
          <strong>${option.letter})</strong>
          <span>${esc(option.text)}</span>
        </button>
      `).join("")}
    </div>

    <button
      id="confirm"
      class="primary"
      ${answered || !selected[i] ? "disabled" : ""}
    >
      ${answered ? "Resposta confirmada" : "Confirmar resposta"}
    </button>

    ${feedback}
  `;

  $("screen").innerHTML = `
    <h1>${comment ? "Comentário da questão" : "Questão"} ${q.n}</h1>
    <div class="source">${esc(q.source)}</div>
    ${content}
  `;

  document.querySelectorAll("[data-letter]").forEach(button => {
    button.onclick = () => {
      selected[i] = button.dataset.letter;
      render();
    };
  });

  if ($("confirm")) {
    $("confirm").onclick = () => {
      if (answers[i] || !selected[i]) return;

      answers[i] = selected[i];
      tone(answers[i] === q.key);
      render();
    };
  }
}

function move(delta) {
  page = Math.max(0, Math.min(22, page + delta));
  render();
  window.scrollTo(0, 0);
}

$("back").onclick = () => move(-1);

$("next").onclick = () => {
  if (!$("next").disabled) move(1);
};

$("restart").onclick = () => {
  if (
    answers.some(Boolean) &&
    !confirm("Reiniciar o quiz e apagar as respostas desta tentativa?")
  ) {
    return;
  }

  page = 0;
  selected.fill(null);
  answers.fill(null);

  render();
  window.scrollTo(0, 0);
};

$("sound").onclick = () => {
  soundOn = !soundOn;

  $("sound").textContent = soundOn
    ? "🔊 Som ligado"
    : "🔇 Som desligado";

  $("sound").setAttribute("aria-pressed", String(soundOn));
};

render();
</script>
</body>
</html>
